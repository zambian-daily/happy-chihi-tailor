<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>送信完了 | HAPPY CHIHI TAILOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #1A1A1A;
      --accent: #C96A3D;
      --border: #E8E0D5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .wrapper {
      max-width: 900px;
      width: 100%;
      margin: auto;
      padding: 120px 24px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      margin-bottom: 18px;
    }

    p {
      font-size: 1rem;
      color: rgba(26, 26, 26, 0.8);
      line-height: 1.8;
      max-width: 700px;
      margin: 0 auto 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 1rem;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: rgba(26, 26, 26, 0.7);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>送信が完了しました</h1>
    <p>ご連絡ありがとうございます。内容を確認次第、担当者より折り返しご連絡いたします。
      <br />
      24時間以内に返信がない場合は、メールアドレスの誤りがないかご確認ください。</p>
    <a class="button" href="index.html">トップページに戻る</a>
  </div>
  <footer>
    <p>HAPPY CHIHI TAILOR · Handmade with love from African fabric</p>
  </footer>
</body>
</html>
