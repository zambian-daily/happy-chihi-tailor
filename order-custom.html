<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>オーダーメイドのご依頼 | HAPPY CHIHI TAILOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #1A1A1A;
      --accent: #C96A3D;
      --border: #E8E0D5;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(232, 224, 213, 0.8);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo img {
      height: 50px;
      display: block;
    }

    nav {
      display: none;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-end;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .nav-links a {
      color: var(--text);
      white-space: nowrap;
    }

    .nav-links a.order-custom {
      color: var(--accent);
      font-weight: 700;
    }

    .page-title {
      max-width: 900px;
      margin: 0 auto;
      padding: 160px 24px 0;
    }

    .page-title h1 {
      margin: 0 0 14px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      letter-spacing: 0.04em;
    }

    .page-title p {
      margin: 0;
      max-width: 720px;
      color: rgba(26, 26, 26, 0.75);
      font-size: 1rem;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .form-card {
      padding: 32px;
      background: var(--surface);
      border-radius: 28px;
      border: 1px solid rgba(232, 224, 213, 0.9);
      box-shadow: var(--shadow);
    }

    .form-group {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.98rem;
    }

    .form-group input[type='text'],
    .form-group input[type='email'],
    .form-group input[type='tel'],
    .form-group input[type='date'],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      font: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(201, 106, 61, 0.12);
    }

    .choice-group {
      display: grid;
      gap: 12px;
      padding: 18px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
    }

    .choice-group label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-weight: 500;
    }

    .choice-group input[type='radio'] {
      accent-color: var(--accent);
    }

    .color-detail {
      display: none;
    }

    #color-hope:checked ~ .color-detail {
      display: block;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 0.01em;
    }

    .footer {
      background: var(--text);
      color: #fff;
      padding: 40px 24px;
      margin-top: 40px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 10px;
      justify-items: center;
      text-align: center;
    }

    .footer-inner p {
      margin: 0;
      opacity: 0.78;
      font-size: 0.95rem;
    }

    @media (min-width: 768px) {
      nav {
        display: block;
      }

      .nav-inner {
        padding: 18px 32px;
      }

      .page-title {
        padding-top: 180px;
      }
    }

    @media (max-width: 520px) {
      .nav-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .page-title {
        padding-top: 140px;
      }

      .form-card {
        padding: 24px;
      }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: white;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 4px;
    }

    .modal-box h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    .modal-item {
      border-bottom: 1px solid #E8E0D5;
      padding: 12px 0;
      font-size: 0.9rem;
    }

    .modal-item span {
      color: #999;
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-cancel {
      flex: 1;
      padding: 14px;
      border: 1px solid #1A1A1A;
      background: white;
      cursor: pointer;
      font-family: Inter, sans-serif;
    }

    .btn-submit {
      flex: 1;
      padding: 14px;
      background: #C96A3D;
      color: white;
      border: none;
      cursor: pointer;
      font-family: Inter, sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-inner">
      <a class="brand-logo" href="index.html">
        <img src="images/brand logo.JPG" alt="HAPPY CHIHI TAILOR logo" />
      </a>
      <nav>
        <div class="nav-links">
          <a href="index.html#accessories">アクセサリ</a>
          <a href="index.html#bags">バッグ</a>
          <a href="index.html#wallets">財布</a>
          <a href="index.html#pouch">ポーチ</a>
          <a href="index.html#fashion">ファッション</a>
          <a href="index.html#interior">インテリア</a>
          <a href="index.html#home">雑貨・小物</a>
          <a href="index.html#order">注文する</a>
          <a href="order-custom.html" class="order-custom">オーダーメイド</a>
          <a href="inquiry.html">お問い合わせ</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-title">
      <h1>オーダーメイドのご依頼</h1>
      <p>世界に一つだけ、あなただけのアフリカ布アイテムをお作りします</p>
    </section>

    <section class="form-card">
      <form action="https://formspree.io/f/xkoewdap" method="POST">
        <input type="hidden" name="_next" value="https://zambian-daily.github.io/happy-chihi-tailor/thankyou.html" />
        <input type="hidden" name="オーダー番号" id="order-id" />
        <input type="hidden" name="_subject" id="email-subject" />
        <div class="form-group">
          <label for="name">お名前（必須）</label>
          <input type="text" id="name" name="name" required placeholder="例：山田 太郎" />
        </div>

        <div class="form-group">
          <label for="contact">メールアドレス（必須）</label>
          <input type="email" id="contact" name="_replyto" required placeholder="例：your@email.com" />
        </div>

        <div class="form-group">
          <label>布の選択（必須）</label>
          <div class="choice-group">
            <label><input type="radio" name="fabric_choice" value="おまかせ" checked required>おまかせ（製作者が選びます）</label>
            <label><input type="radio" name="fabric_choice" value="自分で持ち込む" required>自分で持ち込む</label>
          </div>
        </div>

        <div class="form-group">
          <label for="fabric_notes">持ち込みの場合の備考（任意）</label>
          <textarea id="fabric_notes" name="fabric_notes" placeholder="布の色・柄・素材などをご記入ください"></textarea>
        </div>

        <div class="form-group">
          <label for="category">商品カテゴリ（必須）</label>
          <select id="category" name="product_category" required>
            <option value="">選択してください</option>
            <option value="バッグ（トート・巾着・エコバッグなど）">バッグ（トート・巾着・エコバッグなど）</option>
            <option value="ポーチ・財布">ポーチ・財布</option>
            <option value="アクセサリ（ピアス・シュシュなど）">アクセサリ（ピアス・シュシュなど）</option>
            <option value="ファッション（シャツ・ジャケット・エプロンなど）">ファッション（シャツ・ジャケット・エプロンなど）</option>
            <option value="インテリア・雑貨">インテリア・雑貨</option>
            <option value="その他（下のコメント欄に記入）">その他（下のコメント欄に記入）</option>
          </select>
        </div>

        <div class="form-group">
          <label for="shape">サイズ・形の希望（任意）</label>
          <textarea id="shape" name="shape_preferences" placeholder="例：A4が入るサイズ、マチあり、ファスナー付きなど"></textarea>
        </div>

        <div class="form-group">
          <label>色・柄の希望（任意）</label>
          <div class="choice-group">
            <input type="radio" name="color_preference" value="おまかせ" id="color-free" checked>
            <label for="color-free">おまかせ</label>
            <input type="radio" name="color_preference" value="希望あり" id="color-hope">
            <label for="color-hope">希望あり</label>
            <div class="color-detail">
              <input type="text" name="color_details" placeholder="希望する色や柄をご記入ください" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="reference">参考画像・URL（任意）</label>
          <input type="text" id="reference" name="reference" placeholder="InstagramやPinterestのURLなど" />
        </div>

        <div class="form-group">
          <label for="pickup-date">受け取り希望期限（任意）</label>
          <input type="date" id="pickup-date" name="preferred_date" />
        </div>

        <div class="form-group">
          <label for="delivery_method">受け渡し方法（必須）</label>
          <select id="delivery_method" name="delivery_method" required>
            <option value="">選択してください</option>
            <option value="JICAザンビア事務所 ピジョンボックス">JICAザンビア事務所 ピジョンボックス</option>
            <option value="ルサカの製作所まで取りに来る">ルサカの製作所まで取りに来る</option>
            <option value="イベント等で直接手渡し">イベント等で直接手渡し</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budget">ご予算の目安（任意）</label>
          <input type="text" id="budget" name="budget" placeholder="例：K20,000前後" />
        </div>

        <div class="form-group">
          <label for="additional_comments">その他ご希望・コメント（任意）</label>
          <textarea id="additional_comments" name="additional_comments" placeholder="ご要望やご質問があればご記入ください。"></textarea>
        </div>

        <button type="button" class="button" onclick="openModal()">オーダーメイドを依頼する</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>HAPPY CHIHI TAILOR</p>
      <p>© 2025 Happy Chihi Tailor · Lusaka, Zambia</p>
      <p>Handmade with love from African fabric</p>
    </div>
  </footer>

  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
      <h3>注文内容の確認</h3>
      <div id="modal-content"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">修正する</button>
        <button class="btn-submit" onclick="submitForm()">送信する</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.querySelector('form');
    const orderId = 'CUSTOM-' + Date.now().toString().slice(-6);
    document.getElementById('order-id').value = orderId;
    document.getElementById('email-subject').value = '【オーダーメイド】' + orderId;
    const dateInput = document.getElementById('pickup-date');
    const today = new Date();
    const minDate = new Date(today);
    minDate.setDate(today.getDate() + 7);
    dateInput.min = minDate.toISOString().split('T')[0];

    function openModal() {
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      const inputs = form.querySelectorAll('input:not([type=hidden]), select, textarea');
      let html = '';
      inputs.forEach(input => {
        if (!input.value) return;
        const label = document.querySelector('label[for="' + input.id + '"]');
        const labelText = label ? label.textContent : input.name;
        html += '<div class="modal-item"><span>' + labelText + '</span>' + input.value + '</div>';
      });
      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('confirm-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('confirm-modal').classList.remove('active');
    }

    function submitForm() {
      form.submit();
    }
  </script>
</body>
</html>
