<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注文フォーム | HAPPY CHIHI TAILOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #1A1A1A;
      --accent: #C96A3D;
      --border: #E8E0D5;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(232, 224, 213, 0.8);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo img {
      height: 50px;
      display: block;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-end;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    nav {
      display: none;
    }

    .page-title {
      max-width: 900px;
      margin: 0 auto;
      padding: 160px 24px 0;
    }

    .page-title h1 {
      margin: 0 0 14px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      letter-spacing: 0.04em;
    }

    .page-title p {
      margin: 0;
      max-width: 720px;
      color: rgba(26, 26, 26, 0.75);
      font-size: 1rem;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .form-card {
      padding: 32px;
      background: var(--surface);
      border-radius: 28px;
      border: 1px solid rgba(232, 224, 213, 0.9);
      box-shadow: var(--shadow);
    }

    .form-group {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    label {
      font-weight: 600;
      font-size: 0.98rem;
    }

    input[type='text'],
    input[type='email'],
    input[type='tel'],
    input[type='date'],
    select,
    textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      font: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(201, 106, 61, 0.12);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 0.01em;
    }

    .footer {
      background: var(--text);
      color: #fff;
      padding: 40px 24px;
      margin-top: 40px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 10px;
      justify-items: center;
      text-align: center;
    }

    .footer-inner p {
      margin: 0;
      opacity: 0.78;
      font-size: 0.95rem;
    }

    @media (min-width: 768px) {
      nav {
        display: block;
      }

      .nav-inner {
        padding: 18px 32px;
      }

      .page-title {
        padding-top: 180px;
      }
    }

    @media (max-width: 520px) {
      .nav-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .page-title {
        padding-top: 140px;
      }

      .form-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-inner">
      <a class="brand-logo" href="index.html">
        <img src="images/brand logo.JPG" alt="HAPPY CHIHI TAILOR logo" />
      </a>
      <nav>
        <div class="nav-links">
          <a href="index.html#accessories">アクセサリ</a>
          <a href="index.html#bags">バッグ</a>
          <a href="index.html#wallets">財布</a>
          <a href="index.html#pouch">ポーチ</a>
          <a href="index.html#fashion">ファッション</a>
          <a href="index.html#interior">インテリア</a>
          <a href="index.html#home">雑貨・小物</a>
          <a href="index.html#order">注文する</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-title">
      <h1>注文フォーム</h1>
      <p>商品名と受け取り方法を選んで、安心してご注文ください。注文内容は担当者より確認の連絡を差し上げます。</p>
    </section>

    <section class="form-card">
      <form action="https://formspree.io/f/xkoewdap" method="POST">
        <div class="form-group">
          <label for="name">お名前（必須）</label>
          <input type="text" id="name" name="name" required placeholder="例：山田 太郎" />
        </div>

        <div class="form-group">
          <label for="contact">連絡先 WhatsAppまたはメール（必須）</label>
          <input type="text" id="contact" name="contact" required placeholder="例：+260 97 123 4567 または example@example.com" />
        </div>

        <div class="form-group">
          <label for="product">ご希望の商品名（必須）</label>
          <input type="text" id="product" name="product" required placeholder="例：エプロン、ピアス A" />
        </div>

        <div class="form-group">
          <label for="date">受け取り希望期限（任意）</label>
          <input type="date" id="date" name="preferred_date" />
        </div>

        <div class="form-group">
          <label for="delivery">受け渡し方法（必須）</label>
          <select id="delivery" name="delivery_method" required>
            <option value="">選択してください</option>
            <option value="JICAザンビア事務所 ピジョンボックス">JICAザンビア事務所 ピジョンボックス</option>
            <option value="ルサカの製作所まで取りに来る">ルサカの製作所まで取りに来る</option>
            <option value="イベント等で直接手渡し">イベント等で直接手渡し</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">その他ご希望・コメント（任意）</label>
          <textarea id="message" name="message" placeholder="色やサイズのご希望などがあればご記入ください。"></textarea>
        </div>

        <button type="submit" class="button">注文を送信する</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>HAPPY CHIHI TAILOR</p>
      <p>© 2025 Happy Chihi Tailor · Lusaka, Zambia</p>
      <p>Handmade with love from African fabric</p>
    </div>
  </footer>
</body>
</html>
