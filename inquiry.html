<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お問い合わせ | HAPPY CHIHI TAILOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #1A1A1A;
      --accent: #C96A3D;
      --border: #E8E0D5;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(232, 224, 213, 0.8);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo img {
      height: 50px;
      display: block;
    }

    nav {
      display: none;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-end;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .nav-links a {
      color: var(--text);
      white-space: nowrap;
    }

    .nav-links a.order-custom {
      color: var(--accent);
      font-weight: 700;
    }

    .page-title {
      max-width: 900px;
      margin: 0 auto;
      padding: 160px 24px 0;
    }

    .page-title h1 {
      margin: 0 0 14px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      letter-spacing: 0.04em;
    }

    .page-title p {
      margin: 0;
      max-width: 720px;
      color: rgba(26, 26, 26, 0.75);
      font-size: 1rem;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .form-card {
      padding: 32px;
      background: var(--surface);
      border-radius: 28px;
      border: 1px solid rgba(232, 224, 213, 0.9);
      box-shadow: var(--shadow);
    }

    .form-group {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.98rem;
    }

    .form-group input[type='text'],
    .form-group input[type='email'],
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      font: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(201, 106, 61, 0.12);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 0.01em;
    }

    .footer {
      background: var(--text);
      color: #fff;
      padding: 40px 24px;
      margin-top: 40px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 10px;
      justify-items: center;
      text-align: center;
    }

    .footer-inner p {
      margin: 0;
      opacity: 0.78;
      font-size: 0.95rem;
    }

    @media (min-width: 768px) {
      nav {
        display: block;
      }

      .nav-inner {
        padding: 18px 32px;
      }

      .page-title {
        padding-top: 180px;
      }
    }

    @media (max-width: 520px) {
      .nav-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .page-title {
        padding-top: 140px;
      }

      .form-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-inner">
      <a class="brand-logo" href="index.html">
        <img src="images/brand logo.JPG" alt="HAPPY CHIHI TAILOR logo" />
      </a>
      <nav>
        <div class="nav-links">
          <a href="index.html#accessories">アクセサリ</a>
          <a href="index.html#bags">バッグ</a>
          <a href="index.html#wallets">財布</a>
          <a href="index.html#pouch">ポーチ</a>
          <a href="index.html#fashion">ファッション</a>
          <a href="index.html#interior">インテリア</a>
          <a href="index.html#home">雑貨・小物</a>
          <a href="index.html#order">注文する</a>
          <a href="order-custom.html" class="order-custom">オーダーメイド</a>
          <a href="inquiry.html">お問い合わせ</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-title">
      <h1>お問い合わせ</h1>
      <p>商品やオーダーメイドについて、お気軽にお問い合わせください</p>
    </section>

    <section class="form-card">
      <form action="https://formspree.io/f/xkoewdap" method="POST">
        <input type="hidden" name="_next" value="https://zambian-daily.github.io/happy-chihi-tailor/index.html" />
        <input type="hidden" name="オーダー番号" id="order-id" />
        <input type="hidden" name="_subject" id="email-subject" />
        <div class="form-group">
          <label for="name">お名前（必須）</label>
          <input type="text" id="name" name="name" required placeholder="例：山田 太郎" />
        </div>

        <div class="form-group">
          <label for="email">メールアドレス（必須）</label>
          <input type="email" id="email" name="email" required placeholder="例：your@email.com" />
        </div>

        <div class="form-group">
          <label for="inquiry-type">お問い合わせの種類（必須）</label>
          <select id="inquiry-type" name="inquiry_type" required>
            <option value="">選択してください</option>
            <option value="商品について">商品について</option>
            <option value="オーダーメイドについて">オーダーメイドについて</option>
            <option value="受け渡しについて">受け渡しについて</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">お問い合わせ内容（必須）</label>
          <textarea id="message" name="message" required placeholder="ご質問・ご要望をご記入ください"></textarea>
        </div>

        <button type="submit" class="button" onclick="return confirm('注文内容を確認しました。送信しますか？')">送信する</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>HAPPY CHIHI TAILOR</p>
      <p>© 2025 Happy Chihi Tailor · Lusaka, Zambia</p>
      <p>Handmade with love from African fabric</p>
    </div>
  </footer>

  <script>
    const inquiryId = 'INQ-' + Date.now().toString().slice(-6);
    document.getElementById('order-id').value = inquiryId;
    document.getElementById('email-subject').value = '【お問い合わせ】' + inquiryId;
  </script>
</body>
</html>
